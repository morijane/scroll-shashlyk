<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мемшалык</title>
  <style>
    html, body {
      margin: 0;
      background-color: #340e65;
      overflow-x: hidden;
      overflow-y: auto;
      width: 100%;
      height: 100%;
    }
    .container {
      width: 100%;
      max-width: 1144px;
      margin: 0 auto;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Медиазапрос для мобильных устройств */
    @media (max-width: 768px) {
      img {
        width: 100%;
        height: auto; /* Масштабирование изображения */
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="shalyk.jpg" alt="Мемшалык">
  </div>
</body>
</html>
